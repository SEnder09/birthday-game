<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>紅雁 - 懸疑解謎</title>
  <style>
    :root {
      --bg-color: #0d0606;
      --card-bg: #211111;
      --text-color: #d4c2a5;
      --accent-red: #8b0000;
      --gold: #d4af37;
      --font-family: "Kaiti", "STKaiti", "KaiTi", "SimSun", serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: var(--text-color);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobile Container Frame */
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: radial-gradient(circle, #1a0808 0%, #050202 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      transition: background 1.5s ease;
    }

    /* Scene Styling */
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 72%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
      padding: 20px;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Table Container for Scene 1 */
    .table-surface {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 380px;
      padding: 20px 10px;
      background: rgba(30, 15, 12, 0.6);
      border-bottom: 4px solid #140a07;
      border-radius: 12px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.8);
    }

    /* Walkie-Talkie Component */
    .walkie-talkie {
      width: 80px;
      height: 140px;
      background: #1a1a1a;
      border: 3px solid #333;
      border-radius: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 5px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.7);
      transition: transform 0.15s ease, box-shadow 0.3s;
    }

    .walkie-talkie:active {
      transform: scale(0.94);
    }

    .walkie-antenna {
      position: absolute;
      top: -26px;
      left: 16px;
      width: 7px;
      height: 26px;
      background: #333;
      border-radius: 3px;
    }

    .walkie-led {
      width: 8px;
      height: 8px;
      background: #ff3333;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff3333;
      align-self: flex-end;
      margin-right: 6px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .walkie-led.active {
      background: #33ff33;
      box-shadow: 0 0 8px #33ff33;
    }

    .walkie-grill {
      width: 55px;
      height: 50px;
      background: repeating-linear-gradient(
        0deg,
        #111,
        #111 4px,
        #2a2a2a 4px,
        #2a2a2a 7px
      );
      border-radius: 6px;
      border: 1px solid #222;
    }

    .walkie-btn {
      width: 45px;
      height: 14px;
      background: var(--accent-red);
      border-radius: 4px;
      font-size: 0.6rem;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Wooden Box Component */
    .wooden-box {
      width: 170px;
      height: 140px;
      background: #2a160f;
      border: 4px solid #140a07;
      border-radius: 8px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .wooden-box.ready {
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .wooden-box:active {
      transform: scale(0.96);
    }

    .twine-rope {
      position: absolute;
      width: 100%;
      height: 12px;
      background: #8c6d46;
      border-top: 2px dashed #4a3821;
      border-bottom: 2px dashed #4a3821;
      transition: opacity 0.5s;
    }

    .wax-seal {
      width: 56px;
      height: 56px;
      background: radial-gradient(circle, #b30000 0%, #5a0000 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--gold);
      font-size: 1.3rem;
      font-weight: bold;
      border: 2px dashed #800000;
      box-shadow: 0 0 10px rgba(179, 0, 0, 0.5);
      z-index: 2;
      transition: transform 0.3s, opacity 0.5s;
    }

    /* Dialogue Box */
    #dialogue-box {
      height: 28%;
      background: rgba(15, 8, 8, 0.95);
      border-top: 2px solid var(--accent-red);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
    }

    #speaker-name {
      color: var(--gold);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #dialogue-text {
      color: var(--text-color);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Scene 2 Elements: Puzzle Dial */
    .parchment {
      width: 85%;
      background: #cbb291;
      color: #2b1810;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
      position: relative;
    }

    .hidden-ink {
      color: transparent;
      transition: color 0.8s ease;
      font-weight: bold;
    }

    .hidden-ink.revealed {
      color: #8b0000;
      text-shadow: 0 0 2px rgba(139, 0, 0, 0.3);
    }

    .dial-lock {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .dial-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dial-btn {
      background: #2b1810;
      color: var(--gold);
      border: 1px solid var(--gold);
      width: 40px;
      height: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 4px;
    }

    .dial-value {
      width: 65px;
      height: 50px;
      background: #110808;
      border: 2px solid var(--accent-red);
      color: var(--gold);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      margin: 8px 0;
      border-radius: 4px;
    }

    .action-btn {
      margin-top: 15px;
      padding: 10px 24px;
      background: var(--accent-red);
      color: #fff;
      border: 1px solid var(--gold);
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      font-family: var(--font-family);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Scene 3: Birthday Celebration Theme */
    #game-container.celebration-theme {
      background: radial-gradient(circle, #fff5e6 0%, #f7d6bd 100%);
      --text-color: #4a2c2c;
      --accent-red: #ff6b81;
      --gold: #d4af37;
    }

    #game-container.celebration-theme #dialogue-box {
      background: rgba(255, 255, 255, 0.9);
      border-top: 3px solid #ff6b81;
    }

    .chibi-avatars {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      animation: bounce 2s infinite ease-in-out;
    }

    .chibi-card {
      width: 70px;
      height: 90px;
      background: #fff;
      border: 2px solid #ffb6c1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .chibi-card span {
      font-size: 0.8rem;
      color: #333;
      margin-top: 4px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- SCENE 1: THE ROOM & TABLE -->
    <div id="scene-1" class="scene active">
      <div class="table-surface">
        <!-- Walkie Talkie -->
        <div class="walkie-talkie" id="walkie-talkie" onclick="handleWalkieClick()">
          <div class="walkie-antenna"></div>
          <div class="walkie-led" id="walkie-led"></div>
          <div class="walkie-grill"></div>
          <div class="walkie-btn">TALK</div>
        </div>

        <!-- Wooden Box -->
        <div class="wooden-box" id="wooden-box" onclick="handleBoxClick()">
          <div class="twine-rope" id="twine-rope"></div>
          <div class="wax-seal" id="wax-seal">封</div>
        </div>
      </div>
    </div>

    <!-- SCENE 2: THE PUZZLE -->
    <div id="scene-2" class="scene">
      <div class="parchment">
        <p>「月影交輝，古木鎖心。」</p>
        <p>解謎暗示：尋找屬於妳的特別日子。</p>
        <p class="hidden-ink" id="secret-text">（提示：燭光映照出九月與十三日...）</p>
      </div>

      <button class="action-btn" style="margin-bottom: 10px; background: #4a3821;" onclick="useCandle()">點燃殘燭點驗紙條</button>

      <div class="dial-lock">
        <div class="dial-group">
          <button class="dial-btn" onclick="changeDial('month', 1)">▲</button>
          <div class="dial-value" id="month-val">一月</div>
          <button class="dial-btn" onclick="changeDial('month', -1)">▼</button>
        </div>
        <div class="dial-group">
          <button class="dial-btn" onclick="changeDial('day', 1)">▲</button>
          <div class="dial-value" id="day-val">一日</div>
          <button class="dial-btn" onclick="changeDial('day', -1)">▼</button>
        </div>
      </div>

      <button class="action-btn" onclick="checkPuzzle()">開啟八卦鎖</button>
    </div>

    <!-- SCENE 3: THE BIRTHDAY REVEAL -->
    <div id="scene-3" class="scene">
      <div class="chibi-avatars">
        <div class="chibi-card">🐱<span>我</span></div>
        <div class="chibi-card">🎂<span>蛋糕</span></div>
        <div class="chibi-card">👑<span>壽星</span></div>
      </div>
      <button class="action-btn" style="background: #ff6b81;" onclick="openRealGift()">點擊幸運+1</button>
    </div>

    <!-- DIALOGUE UI -->
    <div id="dialogue-box">
      <div id="speaker-name">我</div>
      <div id="dialogue-text">奇怪……明明約好了今天在這裡聚會，為什麼房間裏一個人也沒有？桌上只留著一部對講機和一個木盒……</div>
    </div>
  </div>

  <script>
    /* CONFIGURATION */
    const CONFIG = {
      friendName: "親愛的Olivia",
      targetMonth: 9,  // 9月
      targetDay: 13,   // 13日
    };

    const chineseNums = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十", "二十一", "二十二", "二十三", "二十四", "二十五", "二十六", "二十七", "二十八", "二十九", "三十", "三十一"];

    /* GAME STATE */
    let gameState = {
      walkieCount: 0,
      ropeCut: false,
      sealBroken: false,
      candleLit: false,
      selectedMonth: 1,
      selectedDay: 1
    };

    function updateDialogue(speaker, text) {
      document.getElementById('speaker-name').innerText = speaker;
      document.getElementById('dialogue-text').innerText = text;
    }

    /* Scene 1: Walkie Talkie Interaction */
    function handleWalkieClick() {
      if ("vibrate" in navigator) navigator.vibrate(40);

      if (gameState.walkieCount < 9) {
        gameState.walkieCount++;
        let zizi = "滋".repeat(gameState.walkieCount);
        updateDialogue("對講機", `「${zizi}……沙沙聲……」只有沙沙聲，完全沒有人回應。`);

        if (gameState.walkieCount === 9) {
          document.getElementById('walkie-led').classList.add('active');
          if ("vibrate" in navigator) navigator.vibrate([100, 50, 100, 50, 200]);
          setTimeout(() => {
            updateDialogue("對講機", "「滋滋滋滋滋滋滋滋滋……沙沙沙……『頻率已對齊……信號干擾消除……』」對講機發出一陣強烈的聲音後歸於平靜，木盒傳出的聲音似乎變清晰了！");
            document.getElementById('wooden-box').classList.add('ready');
          }, 1000);
        }
      } else {
        updateDialogue("對講機", "對講機已經不再發出強烈的雜訊了，只剩下微弱的沙沙聲。");
      }
    }

    /* Scene 1: Wooden Box Interaction */
    function handleBoxClick() {
      if (gameState.walkieCount < 9) {
        if ("vibrate" in navigator) navigator.vibrate(30);
        updateDialogue("神秘木盒", "機能聽到盒子裏傳出一些聲音，但聽不清楚……似乎附近的信號雜訊太強了，試試看按下對講機？");
        return;
      }

      if (!gameState.ropeCut) {
        if ("vibrate" in navigator) navigator.vibrate([80, 40, 80]);
        gameState.ropeCut = true;
        document.getElementById('twine-rope').style.opacity = '0';
        updateDialogue("神秘木盒", "聲音變清晰了！粗麻繩已被切斷，上面還有一個堅硬的朱砂封印，再點擊一次破開它。");
      } else if (!gameState.sealBroken) {
        if ("vibrate" in navigator) navigator.vibrate([150, 80, 150]);
        gameState.sealBroken = true;
        document.getElementById('wax-seal').style.transform = 'scale(1.3)';
        document.getElementById('wax-seal').style.opacity = '0';
        updateDialogue("神秘木盒", "朱砂封印碎裂！木盒緩緩打開，露出裏面的八卦轉盤鎖與一張古舊紙條。");

        setTimeout(() => {
          switchScene('scene-1', 'scene-2');
          updateDialogue("八卦密碼鎖", "解開轉盤上的月份與日期之鎖，才能揭開盒底的最終秘密。");
        }, 1200);
      }
    }

    /* Scene 2 Interaction */
    function useCandle() {
      if (!gameState.candleLit) {
        gameState.candleLit = true;
        document.getElementById('secret-text').classList.add('revealed');
        updateDialogue("殘燭", "燭光照亮了古紙背面的隱形字跡！那是屬於妳的特殊日子。");
      }
    }

    function changeDial(type, delta) {
      if (type === 'month') {
        gameState.selectedMonth += delta;
        if (gameState.selectedMonth > 12) gameState.selectedMonth = 1;
        if (gameState.selectedMonth < 1) gameState.selectedMonth = 12;
        document.getElementById('month-val').innerText = chineseNums[gameState.selectedMonth] + "月";
      } else if (type === 'day') {
        gameState.selectedDay += delta;
        if (gameState.selectedDay > 31) gameState.selectedDay = 1;
        if (gameState.selectedDay < 1) gameState.selectedDay = 31;
        document.getElementById('day-val').innerText = chineseNums[gameState.selectedDay] + "日";
      }
    }

    function checkPuzzle() {
      if (gameState.selectedMonth === CONFIG.targetMonth && gameState.selectedDay === CONFIG.targetDay) {
        if ("vibrate" in navigator) navigator.vibrate([200, 100, 200, 100, 400]);
        updateDialogue("機關卡嗒聲", "密碼正確！古鎖轟然解開，陰暗的氣氛瞬間煙消雲散！");
        setTimeout(() => {
          triggerBirthdayReveal();
        }, 1000);
      } else {
        if ("vibrate" in navigator) navigator.vibrate(100);
        updateDialogue("八卦密碼鎖", "轉盤紋絲不動……似乎日期組合並不正確。");
      }
    }

    /* Scene 3 Birthday Twist */
    function triggerBirthdayReveal() {
      switchScene('scene-2', 'scene-3');
      document.getElementById('game-container').classList.add('celebration-theme');
      updateDialogue("HAPPY BIRTHDAY!", `驚喜！祝 ${CONFIG.friendName} 生日快樂！這不是陰森的懸疑故事，而是大家為妳準備的生日祝福！`);
      startConfetti();
    }

    function switchScene(fromId, toId) {
      document.getElementById(fromId).classList.remove('active');
      document.getElementById(toId).classList.add('active');
    }

    function openRealGift() {
      alert(`🎉 祝福已被領取！\n提示：快去查收為你準備的實體禮物吧！`);
    }

    /* Confetti Animation */
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const particles = [];
      const colors = ['#ff6b81', '#ffd700', '#ffb6c1', '#4bc0c0', '#9b59b6'];

      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          if (p.y > canvas.height) p.y = -10;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        requestAnimationFrame(render);
      }
      render();
    }


    function openRealGift() {
  const scene3 = document.getElementById('scene-3');
  
  scene3.innerHTML = `
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;">
      <h2 style="color: #ff6b81; margin-bottom: 15px; font-size: 1.4rem; text-align: center;">🎉 生日快樂！🎉</h2>
      <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&enablejsapi=1" 
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
      <p style="margin-top: 15px; font-size: 0.95rem; color: #4a2c2c; text-align: center; font-weight: bold;">
        Gotcha! 🎁 (Never gonna give you up~)
      </p>
    </div>
  `;
  
  updateDialogue("Rick Astley", "Never gonna give you up, never gonna let you down... 祝妳生日快樂！🎂🎉");
}
  </script>
</body>
</html>
